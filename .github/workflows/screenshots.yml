name: Capturas de los despliegues

# Semanal + a mano. No corre en cada push: las capturas cambian cuando
# cambian los proyectos, no cuando cambia el portfolio.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

# Necesario para que el job pueda commitear las capturas nuevas.
permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Capturar despliegues
        run: npm run screenshots

      - name: Commitear si alguna captura cambió
        run: |
          if [ -z "$(git status --porcelain public/screenshots)" ]; then
            echo "Sin cambios en las capturas."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/screenshots
          git commit -m "chore: actualizar capturas de los despliegues"
          git push

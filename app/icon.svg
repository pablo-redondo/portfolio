<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    /* Mismos tonos que --bg/--accent en app/globals.css, para que el
       icono de la pestaña cambie con el modo claro/oscuro del sistema
       igual que hace el resto del sitio. */
    .bg { fill: #f6f7f9; }
    .fg { stroke: #9a5309; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f14; }
      .fg { stroke: #ffb44d; }
    }
  </style>
  <rect class="bg" width="24" height="24" rx="6" />
  <path
    class="fg"
    d="M8 7.5 13 12l-5 4.5"
    fill="none"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <line class="fg" x1="14.5" y1="16.5" x2="18" y2="16.5" stroke-width="2.2" stroke-linecap="round" />
</svg>
